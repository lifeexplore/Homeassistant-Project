esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:
#  level: VERY_VERBOSE

time:
  - platform: homeassistant
    id: homeassistant_time 
    
# Enable Home Assistant API
api:
  custom_services: True
  encryption:
    key: "xxxxxxxxx"

ota:
  - platform: esphome
    password: "xxxx"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

#improv_serial:
  
external_components:
  - source: github://myhomeiot/esphome-components
  - source: github://aronsky/esphome-components
  - source: github://dentra/esphome-components
#    components: [qingping, codegen]  
#  - source: my components

#bluetooth_proxy:

qingping:
  mac_address: xx:xx:xx:xx:xx

esp32_ble_tracker:
#  scan_parameters:
#    continuous: True

sensor:
#qingping
  - platform: qingping
    type: co2
    name: "Qingping CO2"
  - platform: qingping
    type: pm25
    name: "Qingping PM2.5"
  - platform: qingping
    type: pm10
    name: "Qingping PM10"
  - platform: qingping
    type: temperature
    name: "Qingping Temperature"
  - platform: qingping
    type: humidity
    name: "Qingping Humidity"

type: state-icon
style:
  left: 12%
  top: 92%
title: 天气
entity: binary_sensor.sanya_warning
conditions:
  - condition: state
    entity: binary_sensor.sanya_warning
    state: "on"
tap_action:
  action: fire-dom-event
  browser_mod:
    service: browser_mod.popup
    data:
      title: 天气预警
      size: classic
      content:
        type: markdown
        card_mod:
          style: |
            ha-card {
             background: none;
             border-radius: 0px;
             border: none
            }         
        content: >-
          <h2><ha-alert alert-type="error">
          {{states.binary_sensor.sanya_warning.attributes.alarms[0].title}}
          </ha-alert></h2>

          {{states.binary_sensor.sanya_warning.attributes.alarms[0].description}}


          详见: {{states.binary_sensor.sanya_warning.attributes.alarms[0].link}}

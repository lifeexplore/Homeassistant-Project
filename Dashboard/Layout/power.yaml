type: state-label
title: 昨天电量
entity: sensor.yesterdaypower
prefix: 昨天
style:
  left: 47%
  top: 92%
  color: blue
tap_action:
  action: fire-dom-event
  browser_mod:
    service: browser_mod.popup
    data:
      title: 南方电网
      size: classic
      content:
        type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: entity
                entity: sensor.yearlypower
                state_color: false
                name: 今年电量
              - type: entity
                entity: sensor.yearlyfee
                name: 今年电费
                unit: 元
          - type: horizontal-stack
            cards:
              - type: entity
                entity: sensor.lastyearpower
                state_color: false
                name: 去年电量
              - type: entity
                entity: sensor.lastyearfee
                name: 去年电费
                unit: 元
          - type: custom:config-template-card
            variables:
              STANDARD: "'\_\_\_\_本月电量: \_\_' + states['sensor.currpower'].state + ' kWh'"
              SPACE: "'\_\_\_\_\_\_'"
              PLUS: "'上月欠款: \_\_' + states['sensor.arreas'].state"
              ARREAS: states['sensor.arreas'].state
            entities:
              - sensor.currpower
            card:
              type: custom:apexcharts-card
              graph_span: 11month
              span:
                start: year
              card_mod:
                style: |
                  ha-card {
                   background: none;
                   border-radius: 0px;
                   border: none
                  }
              header:
                title: "${ARREAS === 'unknown' ? STANDARD : STANDARD + SPACE + PLUS}"
                show: true
                show_states: false
                title_actions:
                  tap_action:
                    action: fire-dom-event
                    browser_mod:
                      service: browser_mod.popup
                      data:
                        title: 周电量
                        size: classic
                        content:
                          type: custom:apexcharts-card
                          header:
                            show: false
                            show_states: false
                            colorize_states: true
                          graph_span: 7d
                          span:
                            end: day
                            offset: "-23.9h"
                          apex_config:
                            plotOptions:
                              bar:
                                columnWidth: 50%
                          series:
                            - entity: sensor.yesterdaypower
                              type: column
                              color: "#5499C7"
                              offset: +1d
                              show:
                                datalabels: true
                              group_by:
                                func: max
                                duration: 24h
              apex_config:
                chart:
                  height: 300px
                xaxis:
                  labels:
                    format: MMM
                plotOptions:
                  bar:
                    columnWidth: 95%
              yaxis:
                - id: first
                  min: 100
                  max: ~800
                  decimals: 0
                  apex_config:
                    tickAmount: 4
                - id: second
                  min: 20
                  max: ~1300
                  opposite: true
                  decimals: 0
                  apex_config:
                    tickAmount: 4
              series:
                - entity: sensor.lastyearfee
                  type: column
                  name: 去年电费
                  color: rgb(255,207,87)
                  yaxis_id: first
                  show:
                    legend_value: false
                  data_generator: |
                    const data = [];
                    const now = new Date();
                    for (let i = 0; i <=11; i++) {
                      const date = new Date(now.getFullYear(), i, 1);
                      let value;
                        value = entity.attributes.fee[11-i];
                      data.push([date.getTime(), value]);
                    }
                    return data;
                - entity: sensor.yearlyfee
                  type: column
                  name: 今年电费
                  yaxis_id: first
                  show:
                    legend_value: false
                  data_generator: |
                    const data = [];
                    const now = new Date();
                    const month = now.getMonth() - 1;
                    for (let i = 0; i <=11; i++) {
                      const date = new Date(now.getFullYear(), i, 1);
                      let value;
                        value = entity.attributes.fee[month-i];
                      data.push([date.getTime(), value]);
                    }
                    return data;
                - entity: sensor.lastyearpower
                  type: column
                  name: 去年电量
                  color: rgb(255,127,71)
                  yaxis_id: second
                  show:
                    legend_value: false
                  data_generator: |
                    const data = [];
                    const now = new Date();
                    for (let i = 0; i <=11; i++) {
                      const date = new Date(now.getFullYear(), i, 1);
                      let value;
                        value = entity.attributes.power[11-i];
                      data.push([date.getTime(), value]);
                    }
                    return data;  
                - entity: sensor.yearlypower
                  type: column
                  name: 今年电量
                  yaxis_id: second
                  show:
                    legend_value: false
                  data_generator: |
                    const data = [];
                    const now = new Date();
                    const month = now.getMonth();
                    for (let i = 0; i <=11; i++) {
                      const date = new Date(now.getFullYear(), i, 1);
                      let value;
                        value = entity.attributes.power[month-i];
                      data.push([date.getTime(), value]);
                    }
                    return data;

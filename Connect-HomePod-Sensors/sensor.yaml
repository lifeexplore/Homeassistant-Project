#Homepod Sensors
- trigger:
    - platform: event
      event_type: homepod_sensors_update
  sensor:
    - name: Bedroom Temperature
      unique_id: bedroom_temperature
      icon: mdi:thermometer
      state: '{{ trigger.event.data.bedroom_temp }}'
      unit_of_measurement: '°C'
      device_class: temperature
      state_class: measurement
    - name: Bedroom Humidity
      unique_id: bedroom_humidity
      unit_of_measurement: '%'
      icon: mdi:water-percent      
      state: '{{ trigger.event.data.bedroom_hum }}'
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement         
    - name: Second Temperature
      unique_id: second_temperature
      icon: mdi:thermometer
      state: '{{ trigger.event.data.second_temp }}'
      unit_of_measurement: '°C'
      device_class: temperature
      state_class: measurement   
    - name: Second Humidity
      unique_id: second_humidity
      unit_of_measurement: '%'
      icon: mdi:water-percent
      state: '{{ trigger.event.data.second_hum }}'
      device_class: humidity
      state_class: measurement
 
        
        